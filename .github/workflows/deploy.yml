name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Keep deployment optional until the hosting credentials are configured. The
# CI job remains authoritative; without these secrets this workflow must not
# fail a push just because the account wiring is not present yet.
env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1) CI — typecheck + tests (runs on every push/PR)
  # ───────────────────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: cd server && npm ci

      - name: Typecheck (frontend + server)
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run server tests
        run: cd server && npm test -- --run

  # ───────────────────────────────────────────────────────────────
  # 2) Deploy — only on push to main, after CI passes
  #    Vercel (frontend) + Render (API/worker) deploy hooks.
  #    Secrets required in repo Settings > Secrets:
  #      VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  #      RENDER_DEPLOY_HOOK  (Render "Deploy Hook" URL)
  # ───────────────────────────────────────────────────────────────
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Vercel: build + promote frontend to production ---
      - name: Check Vercel credentials
        id: vercel-credentials
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials are not configured; skipping hosting deploy."
          fi

      - name: Deploy frontend to Vercel (production)
        if: steps.vercel-credentials.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"

      # --- Render: trigger image rebuild + redeploy (API + worker) ---
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
