name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; jobs opt into more if needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Install server deps
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Typecheck (web + server)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build (web)
        run: npm run build
        env:
          # Public, non-secret build-time defaults; real values come from
          # environment secrets at deploy time, never committed.
          NEXT_PUBLIC_WALLETCONNECT_ID: demo
          NEXT_PUBLIC_SEPOLIA_RPC: https://rpc.sepolia.org
          NEXT_PUBLIC_API_BASE: http://localhost:4000

  security:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
