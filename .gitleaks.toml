# gitleaks config — secret scanning for LiquidAI CI
# Uses the default gitleaks ruleset plus repo-specific allowlist for placeholders.
title = "LiquidAI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow documented placeholder values in .env.example"
regexes = [
  # zeroed testnet private key placeholder in .env.example
  '''WORKER_PRIVATE_KEY=0x0{64}''',
  # documented demo/public values
  '''NEXT_PUBLIC_WALLETCONNECT_ID=demo''',
]
paths = [
  '''package-lock\.json''',
  '''server/package-lock\.json''',
]
